# Configurazione degli strumenti di sviluppo del progetto Winery Adventures.
# Ruff opera sia da formatter (uniforma l'aspetto del codice) sia da linter
# (segnala errori e violazioni di stile).

[tool.ruff]
# Lunghezza massima della riga.
line-length = 120
# Versione minima di Python supportata, riferimento per i controlli di ammodernamento.
target-version = "py310"

[tool.ruff.lint]
# Insiemi di regole attivi:
#   E, W -> stile PEP 8 (pycodestyle)
#   F    -> errori logici e import inutilizzati (pyflakes)
#   I    -> ordinamento degli import (isort)
#   UP   -> costrutti aggiornati alle versioni recenti di Python (pyupgrade)
#   B    -> insidie comuni (flake8-bugbear)
select = ["E", "W", "F", "I", "UP", "B"]

# Classificazione esplicita degli import per l'ordinamento (regola I).
[tool.ruff.lint.isort]
# Dichiara wandb come libreria di terze parti. La cartella locale di log wandb/,
# esclusa dal versionamento, altrimenti induce la classificazione di wandb come
# modulo interno al progetto, con ordinamento degli import divergente tra
# ambiente locale e integrazione continua.
known-third-party = ["wandb"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: contrassegna i test di accettazione end-to-end, lenti",
]

[tool.coverage.run]
source = ["winery_adventures"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "@njit",
]